# CI de SPENDY: análisis estático y pruebas en cada push y pull request.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: SQLite para las pruebas (sqflite_common_ffi)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Dependencias
        run: flutter pub get --enforce-lockfile
      - name: Análisis
        run: flutter analyze
      - name: Pruebas
        run: flutter test
